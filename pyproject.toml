[project]
name = "rulbench"
version = "0.1.0"
description = "Zero-shot TSFM evaluation harness for RUL benchmarks"
requires-python = ">=3.11"
dependencies = [
    "dotime==0.1.3",
    "h5py>=3.16.0",
    "marimo>=0.23.15",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulbench"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
]
eval = [
    "rul-datasets>=0.18.0",
]
train = [
    "torch>=2.4",
    "wandb>=0.28.2",
    "xlstm==2.0.5",
]

[project]
name = "rulbench"
version = "0.1.0"
description = "Zero-shot TSFM evaluation harness for RUL benchmarks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.3,<3",   # verified on pandas 2.x; lift the cap after testing on 3.x
    "rul-datasets>=0.18.0",
    "scikit-learn>=1.6",
    "torch>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulbench"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
]
